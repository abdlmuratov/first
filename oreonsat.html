<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OreonSAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
/* Layout: light, borderless study app that blends into a white page. Topic rail + sheet; tabs for practice and progress. */
:root {
  color-scheme: light;
  --bg: #ffffff; --soft: #f4f6fb; --soft2: #e9eef8; --card: #ffffff;
  --ink: #111827; --muted: #667085; --faint: #98a2b3;
  --accent: #3d5af1; --accent2: #6b4ef6; --accent-ink: #ffffff; --accent-soft: #eaeeff;
  --ok: #10a35a; --ok-soft: #e6f7ee; --bad: #e5484d; --bad-soft: #fdecec; --warn: #f59f0b; --warn-soft: #fff4e0;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .06);
  --f-ui: "Onest", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.55 var(--f-ui); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 1px; box-shadow: 0 0 0 2px var(--accent); border-radius: 10px; }

.app { max-width: 1160px; margin: 0 auto; padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; color: #fff; font: 800 15px var(--f-ui); letter-spacing: -.02em; }
.brand b { font: 800 22px/1 var(--f-ui); letter-spacing: -.03em; }
.brand small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.tabs { display: inline-flex; background: var(--soft); padding: 4px; border-radius: 12px; gap: 2px; }
.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 22px; align-items: start; }
.rail { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; background: var(--soft); border-radius: 18px; padding: 10px; }
.dom { padding: 8px 6px 2px; }
.dom-h { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); padding: 4px 8px 6px; }
.tl { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 8px; width: 100%; border: 0; background: transparent; text-align: left; padding: 9px 10px; border-radius: 11px; font-size: 14px; font-weight: 500; }
.tl:hover { background: var(--card); }
.tl[aria-current="true"] { background: var(--card); box-shadow: var(--shadow); font-weight: 600; }
.tl small { font: 500 11.5px var(--f-num); color: var(--muted); }
.tl .pb { grid-column: 1 / -1; }
.pb { height: 4px; border-radius: 4px; background: var(--soft2); overflow: hidden; }
.pb i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.pick { display: none; }

.head { background: linear-gradient(135deg, var(--accent-soft), #f3efff); border-radius: 20px; padding: 20px 22px; margin-bottom: 14px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.head h2 { margin: 4px 0 2px; font: 800 clamp(22px, 3vw, 30px)/1.15 var(--f-ui); letter-spacing: -.02em; text-wrap: balance; }
.head .ru { margin: 0 0 14px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: rgba(255,255,255,.7); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.btn { border: 0; background: var(--card); padding: 8px 14px; border-radius: 11px; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow); }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; box-shadow: none; color: var(--muted); }
.btn.danger { color: var(--bad); }
.meta { margin-top: 12px; font-size: 13px; color: var(--muted); }

.list { display: grid; gap: 12px; }
.card { background: var(--soft); border-radius: 18px; padding: 16px 18px; position: relative; }
.card.ok { background: linear-gradient(0deg, var(--ok-soft), var(--ok-soft)); }
.card.bad { background: linear-gradient(0deg, var(--bad-soft), var(--bad-soft)); }
.ch-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
.num { font: 700 13px var(--f-num); color: var(--ink); }
.tag { background: var(--card); border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 600; }
.lvl { margin-left: auto; display: inline-flex; gap: 3px; }
.lvl i { width: 6px; height: 6px; border-radius: 50%; background: var(--soft2); }
.lvl i.on { background: var(--warn); }
.q { font-size: 16px; line-height: 1.62; overflow-wrap: anywhere; }
.q .katex { font-size: 1.07em; }
.tw { overflow-x: auto; margin: 10px 0 2px; }
table.dt { border-collapse: separate; border-spacing: 0; font-size: 14px; font-variant-numeric: tabular-nums; background: var(--card); border-radius: 12px; overflow: hidden; }
table.dt th, table.dt td { padding: 6px 14px; text-align: center; }
table.dt th { background: var(--accent-soft); font-weight: 700; }
table.dt tr + tr td { box-shadow: inset 0 1px 0 var(--soft2); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.opts.long { grid-template-columns: minmax(0, 1fr); }
.op { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; border: 0; background: var(--card); border-radius: 13px; padding: 10px 12px; font-size: 15px; line-height: 1.45; min-width: 0; transition: background .15s, transform .15s; }
.op:hover:not(:disabled) { background: var(--accent-soft); transform: translateY(-1px); }
.op .L { width: 28px; height: 28px; border-radius: 9px; background: var(--soft); display: grid; place-items: center; font: 700 13px var(--f-num); color: var(--muted); }
.op:disabled { cursor: default; }
.op.right { background: var(--ok); color: #fff; } .op.right .L { background: rgba(255,255,255,.22); color: #fff; }
.op.wrong { background: var(--bad); color: #fff; } .op.wrong .L { background: rgba(255,255,255,.22); color: #fff; }
.op.dim { opacity: .5; }
.spr { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.spr input { border: 0; background: var(--card); border-radius: 11px; padding: 9px 13px; font: 600 16px var(--f-num); width: 180px; max-width: 100%; }
.hint { font-size: 12px; color: var(--muted); }
.fb { margin-top: 10px; font-weight: 700; font-size: 14px; }
.fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); }
.sol { margin-top: 10px; background: var(--card); border-radius: 13px; padding: 11px 13px; font-size: 14.5px; }
.sol b { color: var(--accent); }
.fix { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--card); border-radius: 13px; padding: 10px 12px; }
.fix span { font-size: 14px; font-weight: 600; }
.link { border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 600; padding: 4px 0; margin-top: 8px; }
.empty { background: var(--soft); border-radius: 18px; padding: 26px; text-align: center; color: var(--muted); }

/* practice session */
.ses-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.ses-top .pb { flex: 1; min-width: 120px; height: 8px; }
.ses-count { font: 700 14px var(--f-num); }
.result { background: linear-gradient(135deg, var(--accent-soft), #f3efff); border-radius: 20px; padding: 26px; text-align: center; }
.result .big { font: 800 56px/1 var(--f-num); letter-spacing: -.03em; }
.result p { color: var(--muted); max-width: 46ch; margin: 10px auto 18px; }

/* progress */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--soft); border-radius: 16px; padding: 14px; }
.kpi b { display: block; font: 700 24px/1.1 var(--f-num); letter-spacing: -.02em; }
.kpi span { font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
.panel { background: var(--soft); border-radius: 18px; padding: 16px 18px; min-width: 0; }
.panel h3 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
.dl { display: grid; gap: 10px; }
.dl .r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 14px; }
.dl .r .pb { grid-column: 1 / -1; height: 6px; }
.dl .r em { font: 600 12.5px var(--f-num); font-style: normal; color: var(--muted); }
.weak { display: grid; gap: 8px; }
.weak .w { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border-radius: 13px; padding: 9px 12px; }
.weak .w div { min-width: 0; }
.weak .w b { display: block; font-size: 14px; }
.weak .w small { color: var(--muted); font-size: 12px; }
.ttable { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 14px; }
.ttable td { background: var(--card); padding: 8px 10px; }
.ttable td:first-child { border-radius: 11px 0 0 11px; } .ttable td:last-child { border-radius: 0 11px 11px 0; text-align: right; }
.ttable .pb { width: 90px; display: inline-block; vertical-align: middle; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.g { background: var(--ok-soft); color: var(--ok); } .pill.y { background: var(--warn-soft); color: #b26b00; } .pill.r { background: var(--bad-soft); color: var(--bad); } .pill.n { background: var(--soft2); color: var(--muted); }
.who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.who input { border: 0; background: var(--soft); border-radius: 11px; padding: 9px 13px; width: 240px; max-width: 100%; font-weight: 600; }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 110px; padding-top: 6px; }
.bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.bars i { display: block; width: 100%; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--accent2), var(--accent)); min-height: 3px; }
.bars span { font: 500 10px var(--f-num); color: var(--faint); }
.tw2 { overflow-x: auto; }
a.btn { text-decoration: none; color: inherit; display: inline-block; }
.btn:disabled { opacity: .45; cursor: default; }

/* mock tests */
.mks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.mk { background: var(--soft); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.mk-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mk-n { font: 800 34px/1.15 var(--f-num); letter-spacing: -.03em; }
.mk small { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
.mx-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); padding: 10px 0; margin-bottom: 8px; }
.timer { font: 700 26px/1 var(--f-num); letter-spacing: -.02em; background: var(--soft); padding: 9px 14px; border-radius: 12px; font-variant-numeric: tabular-nums; }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.op.sel { background: var(--ink); color: #fff; } .op.sel .L { background: rgba(255,255,255,.2); color: #fff; }
.mark-b { margin-left: auto; border: 0; background: var(--card); border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 600; color: var(--muted); }
.mark-b.on { background: var(--warn-soft); color: #b26b00; }
.mx-nav { display: flex; justify-content: space-between; gap: 8px; margin: 12px 0; }
.mgrid { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.mgrid button { border: 0; background: var(--soft); border-radius: 9px; padding: 8px 0; font: 700 13px var(--f-num); color: var(--muted); position: relative; }
.mgrid button.done { background: var(--accent-soft); color: var(--accent); }
.mgrid button.cur { background: var(--ink); color: #fff; }
.mgrid button.mark::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.mgrid button.okk { background: var(--ok-soft); color: var(--ok); }
.mgrid button.bad { background: var(--bad-soft); color: var(--bad); }
.mgrid button.skip { background: var(--soft2); color: var(--faint); }
.mlab { font-size: 11.5px; font-weight: 700; color: var(--faint); margin: 12px 0 2px; text-transform: uppercase; letter-spacing: .07em; }
.gate-h { font: 800 30px/1.15 var(--f-ui); margin: 6px 0 0; letter-spacing: -.02em; }
.modal { position: fixed; inset: 0; background: rgba(17,24,39,.35); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal[hidden] { display: none; }
.mbox { background: #fff; border-radius: 20px; padding: 18px 20px; max-width: 660px; width: 100%; max-height: 85vh; overflow: auto; box-shadow: var(--shadow); }
.refs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.refs > div { background: var(--soft); border-radius: 12px; padding: 9px 12px; }
.refs small { color: var(--muted); font-size: 12px; }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.note { background: var(--warn-soft); color: #8a5300; border-radius: 13px; padding: 10px 13px; font-size: 13.5px; margin-top: 12px; }

@media (max-width: 880px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .pick { display: block; margin-bottom: 12px; }
  .pick select { width: 100%; border: 0; background: var(--soft); border-radius: 13px; padding: 11px 13px; font-weight: 600; }
  .kpis, .kpis.k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mks, .refs { grid-template-columns: minmax(0, 1fr); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) { .mgrid { grid-template-columns: repeat(6, minmax(0, 1fr)); } .timer { font-size: 20px; } .tabs button { padding: 8px 10px; font-size: 13.5px; } .opts { grid-template-columns: minmax(0, 1fr); } .head { padding: 16px; } .card { padding: 14px; } }
@media (prefers-reduced-motion: reduce) { .op { transition: none; } .op:hover:not(:disabled) { transform: none; } }
/* language */
.lang { border: 0; background: var(--soft); padding: 9px 10px; border-radius: 12px; font: 700 13px var(--f-ui); color: var(--ink); max-width: 150px; }
html[dir="rtl"] [data-nt], html[dir="rtl"] .q, html[dir="rtl"] .opts, html[dir="rtl"] .timer, html[dir="rtl"] .mgrid { direction: ltr; }
.lpick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.lpick-grid button { margin: 0; padding: 12px 14px; font-size: 15px; }
.lpick-box { max-width: 480px; max-height: 100vh; overflow: auto; padding: 8px 0; }
.top-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: 100%; }
.lpick { position: fixed; inset: 0; z-index: 50; background: rgba(255,255,255,.96); display: grid; place-items: center; padding: 16px; }
.lpick-box { width: 100%; max-width: 420px; text-align: center; }
.lpick-box .logo { margin: 0 auto 14px; width: 54px; height: 54px; font-size: 24px; border-radius: 16px; }
.lpick-box h2 { margin: 0 0 4px; font: 800 26px/1.2 var(--f-ui); letter-spacing: -.02em; }
.lpick-box p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.lpick-box button { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; background: var(--soft); border-radius: 14px; padding: 15px 18px; margin-bottom: 10px; font: 700 17px var(--f-ui); text-align: left; }
.lpick-box button:hover { background: var(--accent-soft); }
.lpick-box button.main { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
.lpick-box button small { font-weight: 600; font-size: 12px; opacity: .8; }

/* lessons */
.lesson { background: var(--soft); border-radius: 20px; padding: 18px 22px; font-size: 15.5px; line-height: 1.7; }
.lesson h4 { margin: 18px 0 8px; font-size: 16.5px; letter-spacing: -.01em; }
.lesson h4:first-child { margin-top: 0; }
.lesson ul, .lesson ol { padding-left: 22px; margin: 6px 0; } .lesson li { margin: 4px 0; }
.lesson p { margin: 8px 0; }
.lesson .ex { background: var(--card); border-radius: 14px; padding: 12px 15px; margin: 12px 0; box-shadow: inset 3px 0 0 var(--accent); }
.lesson .trap { background: var(--warn-soft); border-radius: 14px; padding: 12px 15px; margin: 12px 0; }
.lesson .trap::before { content: "Ловушки"; display: block; font-weight: 800; color: #8a5300; margin-bottom: 4px; }
.lesson table.dt { display: block; overflow-x: auto; margin: 8px 0; max-width: 100%; }
.vids { display: grid; gap: 10px; margin-bottom: 14px; }
.vid { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #0b0f1a; }
.vid video { position: absolute; inset: 0; width: 100%; height: 100%; background: #0b0f1a; }
.vcap { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
.vcap a { color: var(--accent); font-weight: 600; text-decoration: none; }
.seen { color: var(--ok); font-weight: 700; }
.tl .ck { font: 700 12px var(--f-ui); color: var(--ok); }
.tabs { max-width: 100%; overflow-x: auto; }

/* subjects + reading passages */
.subj { display: flex; background: var(--card); border-radius: 12px; padding: 3px; gap: 2px; margin: 2px 2px 6px; }
.subj button { flex: 1; border: 0; background: transparent; padding: 7px 8px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--muted); }
.subj button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.pick .subj { background: var(--soft); margin: 0 0 8px; }
.psg { background: var(--card); border-radius: 13px; padding: 12px 15px; font-size: 15.5px; line-height: 1.7; }
.psg p { margin: 0 0 8px; } .psg p:last-child { margin-bottom: 0; }
.psg ul { margin: 4px 0 0; padding-left: 20px; } .psg li { margin: 3px 0; }
.psg + .psg { margin-top: 8px; }
.psg .tw { margin: 8px 0 4px; }
.stem { margin: 12px 0 0; font-weight: 600; font-size: 15px; }
.secpill { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
.secpill.rw { background: #fdf0e6; color: #b45309; } .secpill.math { background: var(--accent-soft); color: var(--accent); }
.mk.full { background: linear-gradient(135deg, var(--accent-soft), #f3efff); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 22px 0 10px; }
.sec-h h3 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.sec-h span { color: var(--muted); font-size: 13px; }
.score2 { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; margin-top: 8px; }
.score2 div { text-align: center; } .score2 b { display: block; font: 800 26px/1.1 var(--f-num); } .score2 span { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="logo">O</div><div><b>OreonSAT</b><small id="brandsub">Digital SAT · Math + Reading &amp; Writing</small></div></div>
    <div class="top-r"><select class="lang" id="langsel" data-nt aria-label="Language"></select>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="lessons" aria-selected="false">Уроки</button>
      <button role="tab" data-tab="practice" aria-selected="true">Задачи</button>
      <button role="tab" data-tab="mock" aria-selected="false">Мок-тесты</button>
      <button role="tab" data-tab="progress" aria-selected="false">Прогресс</button>
    </div></div>
  </div>
  <div id="view"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <div class="row"><span class="pill n">таймер</span><span class="pill n">отметки «вернуться»</span><span class="pill n">Desmos + формулы</span><span class="pill n">балл 400–1600</span></div></section>${banner}
    <div class="sec-h"><h3>Полный SAT</h3><span>Reading &amp; Writing + Math · 4 модуля</span></div><div class="mks">${MOCK.full.map((_, k) => mockCard("full", k)).join("")}</div>
    <div class="sec-h"><h3>Только математика</h3><span>2 модуля по 22 задачи</span></div><div class="mks">${MOCK.math.map((_, k) => mockCard("math", k)).join("")}</div>`;
}
const topicName = t => `<span>${byId[t] ? tr(byId[t].ru) : t}</span>`;
function mockResult() {
  const M = S.mocks[mres.key], a = M && M.att[mres.a];
  if (!a) { mres = null; mpage = "list"; return mockList(); }
  const doms = {}, tops = {};
  a.items.forEach(x => { const p = PP(x.id), d = doms[p.dom] || (doms[p.dom] = { n: 0, ok: 0, sec: p.sec }); d.n++; if (x.ok) d.ok++; else tops[p.topic] = (tops[p.topic] || 0) + 1; });
  const domHTML = Object.keys(DOM_RU).filter(d => doms[d]).map(d => { const v = doms[d]; return `<div class="r"><span>${tr(DOM_RU[d])}</span><em>${v.ok}/${v.n}</em><span class="pb"><i style="width:${Math.round(100 * v.ok / v.n)}%"></i></span></div>`; }).join("");
  const fixHTML = Object.entries(tops).sort((x, y) => y[1] - x[1]).slice(0, 8).map(([t, c]) => `<div class="w"><div><b>${topicName(t)}</b><small>ошибок в тесте: ${c}</small></div>${byId[t] ? `<button class="btn primary" data-fix="${t}" data-tpl="">10 задач</button>` : ""}</div>`).join("") || `<div class="empty" style="padding:16px">Ошибок нет — идеальный тест!</div>`;
  const grids = a.parts.map((pt, pi) => { const its = a.items.map((x, i) => ({ x, i })).filter(o => o.x.pi === pi); return `<div class="mlab">${SEC[pt.sec].name} · модуль ${pt.mod} · ${pt.c}/${pt.n}</div><div class="mgrid">${its.map(({ x, i }, j) => `<button data-mjr="${i}" class="${x.ok ? "okk" : x.g === "—" ? "skip" : "bad"}">${j + 1}</button>`).join("")}</div>`; }).join("");
  const list = a.items.map((x, i) => ({ x, i })).filter(({ x }) => mres.f === "all" || !x.ok).map(({ x, i }) => {
    const p = PP(x.id), pt = a.parts[x.pi], j = a.items.filter((y, yi) => y.pi === x.pi && yi <= i).length;
    return `<div id="mr-${i}"><div class="eyebrow" style="margin:0 0 6px">${SEC[pt.sec].name} · модуль ${pt.mod} · вопрос ${j} · ${topicName(p.topic)}</div>${card(Object.assign({}, p, { n: j }), { ok: x.ok, a: x.g }, "mock", "m")}</div>`;
  }).join("") || `<div class="empty">Ошибок нет.</div>`;
  const tm = ms => Math.max(1, Math.round(ms / 60000)) + " мин";
  const full = a.kind === "full", total = a.items.length, ok = a.items.filter(x => x.ok).length;
  const secHTML = full ? `<div class="score2">${["rw", "math"].map(s => `<div><b>${a.secs[s].score}</b><span>${SEC[s].name} · ${a.secs[s].c}/${a.secs[s].n}</span></div>`).join("")}</div>` : "";
  return `<div class="ses-top"><button class="btn ghost" data-mlist="1">← Все мок-тесты</button></div>
    <div class="result"><div class="eyebrow">${mtitle(a.kind, a.k)}${S.name ? " · " + esc(S.name) : ""} · ${new Date(a.ts).toLocaleDateString("ru-RU")}</div><div class="big">${a.score}</div><p>примерный балл ${full ? "SAT (400–1600)" : "SAT Math (200–800)"} · верно ${ok} из ${total}</p>${secHTML}<div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" data-mstart="${a.kind}:${a.k}">Пройти ещё раз</button><button class="btn" data-tab="progress">Мой прогресс</button></div></div>
    <div class="kpis k4" style="margin-top:12px">${a.parts.slice(0, 4).map(pt => `<div class="kpi"><b>${pt.c}/${pt.n}</b><span>${SEC[pt.sec].ru}, модуль ${pt.mod} · ${tm(pt.used)}</span></div>`).join("")}</div>
    <div class="grid2"><div class="panel"><h3>По разделам</h3><div class="dl">${domHTML}</div><h3 style="margin-top:18px">Ответы</h3>${grids}</div><div class="panel"><h3>Работа над ошибками</h3><div class="weak">${fixHTML}</div></div></div>
    <div class="sec-h"><h3>Разбор</h3><div class="seg" style="background:var(--soft)"><button data-mf="bad" aria-pressed="${mres.f === "bad"}">Ошибки</button><button data-mf="all" aria-pressed="${mres.f === "all"}">Все вопросы</button></div></div><div class="list">${list}</div>`;
}
function renderMock() {
  const r = S.run;
  if (mpage === "run" && r) view.innerHTML = r.phase === "gate" ? mockGate(r) : r.phase === "review" ? mockReview(r) : mockExam(r);
  else if (mpage === "res" && mres) view.innerHTML = mockResult();
  else view.innerHTML = mockList();
}
let lastTick = Date.now();
setInterval(() => {
  const now = Date.now(), dt = Math.min(now - lastTick, 3000); lastTick = now;
  const r = S.run; if (!r || tab !== "mock" || mpage !== "run" || (r.phase !== "exam" && r.phase !== "review")) return;
  r.left -= dt;
  if (r.left <= 0) { r.left = 0; submitPart(); return; }
  const el = document.getElementById("timer"); if (el) { el.textContent = fmt(r.left); el.classList.toggle("low", r.left < 300000); }
  if (Math.floor(r.left / 1000) % 5 === 0) save();
}, 1000);

/* ---------- progress view ---------- */
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function renderProgress() {
  let done = 0, ok = 0;
  for (const t of DATA) { const s = stats(t.id); done += s.done; ok += s.ok; }
  const acc = done ? Math.round(100 * ok / done) : 0;
  const days = new Set(S.log.map(l => dayKey(l[0])));
  let streak = 0; { const d = new Date(); if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1); for (;;) { if (days.has(dayKey(d))) { streak++; d.setDate(d.getDate() - 1); } else break; } }
  const today = S.log.filter(l => dayKey(l[0]) === dayKey(Date.now())).length;
  const bars = []; for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = dayKey(d); bars.push([d, S.log.filter(l => dayKey(l[0]) === k).length]); }
  const mx = Math.max(5, ...bars.map(b => b[1]));
  const doms = {}; for (const t of DATA) { const s = stats(t.id); const d = doms[t.domain] || (doms[t.domain] = { done: 0, ok: 0, total: 0 }); d.done += s.done; d.ok += s.ok; d.total += t.problems.length; }
  const domHTML = sj => Object.entries(doms).filter(([d]) => DATA.find(t => t.domain === d).subj === sj).map(([d, v]) => { const a = v.done ? Math.round(100 * v.ok / v.done) : 0; const ready = Math.round(a * Math.min(1, v.done / (v.total * 0.25))); return `<div class="r"><span>${tr(DOM_RU[d])}</span><em>${v.done ? a + "% верно" : "не начато"}</em><span class="pb"><i style="width:${ready}%"></i></span></div>`; }).join("");
  const rows = DATA.map(t => { const s = stats(t.id); const a = s.done ? Math.round(100 * s.ok / s.done) : null; return { t, s, a }; });
  const status = r => r.s.done === 0 ? `<span class="pill n">Не начата</span>` : r.s.done < 5 ? `<span class="pill n">Мало данных</span>` : r.a >= 85 ? `<span class="pill g">Сильная</span>` : r.a >= 65 ? `<span class="pill y">Почти</span>` : `<span class="pill r">Подтянуть</span>`;
  // weak topics also from mocks
  const mockErr = {}; for (const M of Object.values(S.mocks)) for (const a of M.att.slice(-3)) for (const x of a.items) if (!x.ok) { const t = PP(x.id).topic; mockErr[t] = (mockErr[t] || 0) + 1; }
  const weak = rows.filter(r => (r.s.done >= 3 && r.a < 75) || mockErr[r.t.id] >= 2).sort((x, y) => ((x.a ?? 50) - (mockErr[x.t.id] || 0) * 5) - ((y.a ?? 50) - (mockErr[y.t.id] || 0) * 5)).slice(0, 7);
  const weakHTML = weak.length ? weak.map(r => `<div class="w"><div><b>${tr(r.t.ru)}</b><small>${r.s.done ? r.a + "% верно в практике" : "в практике не решалась"}${mockErr[r.t.id] ? ` · ${mockErr[r.t.id]} ош. в мок-тестах` : ""}</small></div><button class="btn primary" data-fix="${r.t.id}" data-tpl="">10 задач</button></div>`).join("")
    : `<div class="empty" style="padding:16px">Слабых тем пока нет. Реши хотя бы 3 задачи в теме или пройди мок-тест — и здесь появится разбор.</div>`;
  const atts = Object.entries(S.mocks).flatMap(([key, M]) => M.att.map((a, i) => ({ key, a, i }))).sort((x, y) => y.a.ts - x.a.ts);
  const bestFull = Math.max(0, ...atts.filter(x => x.a.kind === "full").map(x => x.a.score));
  const mockHTML = atts.length ? `<div class="weak">${atts.slice(0, 8).map(({ key, a, i }) => `<div class="w"><div><b>${mtitle(a.kind, a.k)} · ${a.score}</b><small>${new Date(a.ts).toLocaleDateString("ru-RU")} · ${a.kind === "full" ? `R&amp;W ${a.secs.rw.score} · Math ${a.secs.math.score}` : `верно ${a.items.filter(x => x.ok).length}/${a.items.length}`}</small></div><button class="btn" data-mres="${key}:${i}">Разбор</button></div>`).join("")}</div>`
    : `<div class="empty" style="padding:16px">Пока нет пройденных мок-тестов. <button class="link" data-tab="mock">Открыть мок-тесты →</button></div>`;
  const ttable = sj => rows.filter(r => r.t.subj === sj).map(r => `<tr><td><button class="link" style="margin:0;color:var(--ink);text-align:left" data-topic="${r.t.id}">${tr(r.t.ru)}</button></td><td><span class="pb"><i style="width:${100 * r.s.done / r.t.problems.length}%"></i></span> <span class="hint">${r.s.done}/${r.t.problems.length}</span></td><td>${r.a === null ? "—" : r.a + "%"}</td><td>${status(r)}</td></tr>`).join("");
  view.innerHTML = `
    <div class="who"><label for="nm" style="font-weight:600">Ученик:</label><input id="nm" placeholder="Имя и фамилия" value="${esc(S.name || "")}"><span class="hint">Прогресс сохраняется на этом устройстве</span></div>
    <div class="kpis">
      <div class="kpi"><b>${done}</b><span>решено из ${TOTAL}</span></div>
      <div class="kpi"><b>${done ? acc + "%" : "—"}</b><span>точность</span></div>
      <div class="kpi"><b>${done - ok}</b><span>ошибок</span></div>
      <div class="kpi"><b>${bestFull || "—"}</b><span>лучший полный SAT</span></div>
      <div class="kpi"><b>${Object.keys(S.seen).length}/${DATA.length}</b><span>уроков пройдено</span></div>
      <div class="kpi"><b>${streak}</b><span>дней подряд · сегодня ${today}</span></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Слабые темы</h3><div class="weak">${weakHTML}</div></div>
      <div class="panel"><h3>Мок-тесты</h3>${mockHTML}</div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Готовность: математика</h3><div class="dl">${domHTML("math")}</div><h3 style="margin-top:18px">Готовность: английский</h3><div class="dl">${domHTML("rw")}</div></div>
      <div class="panel"><h3>Активность за 14 дней</h3><div class="bars">${bars.map(([d, v]) => `<div title="${d.toLocaleDateString("ru-RU")}: ${v}"><i style="height:${Math.round(v / mx * 88)}px"></i><span>${d.getDate()}</span></div>`).join("")}</div></div>
    </div>
    <div class="panel"><h3>Все темы · математика</h3><div class="tw2"><table class="ttable"><tbody>${ttable("math")}</tbody></table></div>
      <h3 style="margin-top:16px">Все темы · английский</h3><div class="tw2"><table class="ttable"><tbody>${ttable("rw")}</tbody></table></div></div>
    <div class="row" style="margin-top:14px"><button class="btn danger" id="resetAll">Сбросить весь прогресс</button></div>`;
}

function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  if (tab === "lessons") renderLessons(); else if (tab === "practice") renderPractice(); else if (tab === "mock") renderMock(); else renderProgress();
}

/* ---------- events ---------- */
function answer(ctx, tid, n, ok, given) {
  if (ctx === "ses") { ses.st[n] = { ok, a: given }; if (ok) ses.score++; record(tid, n, ok, given, "fix"); render(); return; }
  record(tid, n, ok, given, "list");
  const el = document.getElementById(`c-${ctx}-${tid}-${n}`);
  if (el) el.outerHTML = card(prob(tid, n), A(tid)[n], ctx, tid);
  const r = rail(); const rl = document.querySelector(".rail"); if (rl) rl.innerHTML = r.h; const pk = document.getElementById("pick"); if (pk) pk.innerHTML = r.o;
  const hd = document.querySelector(".head"); if (hd) hd.outerHTML = headHTML();
}
const top0 = () => scrollTo({ top: 0 });
document.addEventListener("click", e => {
  const g = s => e.target.closest(s);
  let el;
  if (e.target.id === "refm" || g("[data-mref]")) { const m = document.getElementById("refm"); if (m) m.hidden = !m.hidden; return; }
  if ((el = g("[data-lang]"))) { setLang(el.dataset.lang); return; }
  if ((el = g("[data-tab]"))) { tab = el.dataset.tab; if (tab === "mock" && mpage === "res" && !mres) mpage = "list"; render(); top0(); return; }
  if ((el = g("[data-subj]"))) { subj = el.dataset.subj; setTopic(curBy[subj]); render(); return; }
  if ((el = g("[data-lesson]"))) { setTopic(el.dataset.lesson); tab = "lessons"; render(); top0(); return; }
  if ((el = g("[data-seen]"))) { S.seen[el.dataset.seen] = 1; save(); render(); return; }
  if ((el = g("[data-topic]"))) { setTopic(el.dataset.topic); tab = "practice"; render(); top0(); return; }
  if ((el = g("[data-type]"))) { typeF = el.dataset.type; render(); return; }
  if ((el = g("[data-diff]"))) { diffF = el.dataset.diff; render(); return; }
  if (g("[data-shuffle]")) { if (order) order = null; else { order = byId[cur].problems.map(p => p.n).sort(() => Math.random() - 0.5); } render(); return; }
  if ((el = g("[data-fix]"))) { startSession(el.dataset.fix, el.dataset.tpl || null); return; }
  if (g("[data-exit]")) { ses = null; render(); return; }
  if (g("[data-next]")) { ses.i++; render(); top0(); return; }
  // mock
  if ((el = g("[data-mstart]"))) { const [kind, k] = el.dataset.mstart.split(":"); startMock(kind, +k); return; }
  if (g("[data-mcont]")) { mpage = "run"; tab = "mock"; render(); top0(); return; }
  if (g("[data-mbegin]")) { beginPart(); return; }
  if (g("[data-mexit]")) { save(); mpage = "list"; render(); top0(); return; }
  if (g("[data-mlist]")) { mres = null; mpage = "list"; render(); top0(); return; }
  if ((el = g("[data-mres]"))) { const s = el.dataset.mres, c = s.lastIndexOf(":"); mres = { key: s.slice(0, c), a: +s.slice(c + 1), f: "bad" }; mpage = "res"; tab = "mock"; render(); top0(); return; }
  if ((el = g("[data-mopt]"))) { const r = S.run, id = curPart(r).items[r.i]; r.ans[id] = r.ans[id] === el.dataset.mopt ? "" : el.dataset.mopt; save(); render(); return; }
  if (g("[data-mmark]")) { const r = S.run, id = curPart(r).items[r.i]; if (r.marks[id]) delete r.marks[id]; else r.marks[id] = 1; save(); render(); return; }
  if (g("[data-mprev]")) { S.run.i = Math.max(0, S.run.i - 1); save(); render(); top0(); return; }
  if (g("[data-mnext]")) { const r = S.run; if (r.i >= curPart(r).items.length - 1) r.phase = "review"; else r.i++; save(); render(); top0(); return; }
  if ((el = g("[data-mjump]"))) { S.run.i = +el.dataset.mjump; S.run.phase = "exam"; save(); render(); top0(); return; }
  if (g("[data-mback]")) { S.run.phase = "exam"; render(); return; }
  if ((el = g("[data-msubmit]"))) {
    if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = "Точно сдать? Нажми ещё раз"; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = "Сдать модуль"; } }, 4000); return; }
    submitPart(); return;
  }
  if ((el = g("[data-mf]"))) { mres.f = el.dataset.mf; render(); return; }
  if ((el = g("[data-mjr]"))) { const i = el.dataset.mjr; if (!document.getElementById("mr-" + i)) { mres.f = "all"; render(); } const t = document.getElementById("mr-" + i); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if ((el = g("[data-mabandon]"))) {
    if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = "Точно? Ответы удалятся"; return; }
    S.run = null; save(); mpage = "list"; render(); return;
  }
  if ((el = g(".op")) && !el.disabled && el.dataset.t) { const p = prob(el.dataset.t, +el.dataset.n); answer(el.dataset.ctx, el.dataset.t, p.n, el.dataset.l === p.a, el.dataset.l); return; }
  if ((el = g("[data-reveal]"))) { answer(el.dataset.ctx, el.dataset.t, +el.dataset.reveal, false, "—"); return; }
  if ((el = g("#resetAll"))) {
    if (el.dataset.armed) { S = { ans: {}, log: [], name: S.name, mocks: {}, run: null, seen: {} }; mpage = "list"; mres = null; save(); render(); return; }
    el.dataset.armed = "1"; el.textContent = "Точно? Нажми ещё раз — всё обнулится";
    setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = "Сбросить весь прогресс"; } }, 4000);
  }
});
document.addEventListener("submit", e => {
  if (e.target.closest(".mspr")) { e.preventDefault(); const b = document.querySelector("[data-mnext]"); if (b) b.click(); return; }
  const f = e.target.closest(".spr"); if (!f) return; e.preventDefault();
  const p = prob(f.dataset.t, +f.dataset.n), v = f.querySelector("input").value, ok = sprOk(v, p);
  if (ok === null) { f.querySelector(".hint").textContent = "Введи число: 12, -3.5 или 7/4"; return; }
  answer(f.dataset.ctx, f.dataset.t, p.n, ok, v);
});
document.addEventListener("change", e => {
  if (e.target.id === "langsel") { setLang(e.target.value); return; } if (e.target.id === "pick" || e.target.id === "lpick") { setTopic(e.target.value); render(); } });
document.addEventListener("input", e => {
  if (e.target.id === "nm") { S.name = e.target.value.slice(0, 60); save(); }
  if (e.target.id === "m-spr" && S.run) { const r = S.run, id = curPart(r).items[r.i]; r.ans[id] = e.target.value.trim(); save(); const c = document.querySelector(".mgrid .cur"); if (c) c.classList.toggle("done", !!r.ans[id]); }
});
function setLang(l) {
  S.lang = l; save(); LANG = l; buildPat(); applyLangChrome();
  const lp = document.querySelector(".lpick"); if (lp) lp.remove();
  document.getElementById("brandsub").textContent = `Digital SAT · ${TOTAL} задач · ${MOCK.full.length} полных SAT · ${MOCK.math.length} мок-тестов`;
  render(); translate(document.querySelector(".top")); translate(view);
}
render();
translate(document.querySelector(".top")); translate(view);
})();
</script>
</body>
