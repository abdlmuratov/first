<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SAT Math Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
/* Layout: topic rail on the left (19 SAT skills grouped by the 4 domains), drill sheet on the right; graph-paper ground */
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #15202c; --muted: #5a6776; --line: #d6dde5; --grid: rgba(31, 95, 209, 0.06);
  --accent: #1f5fd1; --accent-ink: #ffffff; --accent-soft: #e3ebfb;
  --ok: #17804a; --ok-soft: #e1f3e8; --bad: #be3b26; --bad-soft: #fbe5e0; --warn: #a86a00;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1319; --surface: #151c25; --ink: #e5eaf0; --muted: #94a1b0; --line: #263140; --grid: rgba(122, 167, 255, 0.05);
  --accent: #7ea9ff; --accent-ink: #0b1220; --accent-soft: #1a2944;
  --ok: #52c78b; --ok-soft: #12301f; --bad: #ff8b74; --bad-soft: #3a1b16; --warn: #e3a646; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #151c25; --ink: #e5eaf0; --muted: #94a1b0; --line: #263140; --grid: rgba(122, 167, 255, 0.05);
  --accent: #7ea9ff; --accent-ink: #0b1220; --accent-soft: #1a2944;
  --ok: #52c78b; --ok-soft: #12301f; --bad: #ff8b74; --bad-soft: #3a1b16; --warn: #e3a646; color-scheme: dark }

* { box-sizing: border-box; }
body {
  background-color: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.brand h1 { font: 800 clamp(28px, 4vw, 40px)/1 var(--f-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.brand p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.score { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; min-width: 110px; }
.stat b { display: block; font: 600 22px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 24px; align-items: start; }
aside.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.dom { padding: 10px 8px 4px; }
.dom-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font: 600 12px/1.3 var(--f-body); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.dom-h em { font-style: normal; font-family: var(--f-mono); letter-spacing: 0; text-transform: none; }
.tlink { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); font: 500 14px/1.3 var(--f-body); padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.tlink:hover { background: var(--accent-soft); }
.tlink[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.tlink small { font: 500 12px var(--f-mono); color: inherit; opacity: 0.75; font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.tlink[aria-current="true"] .bar { background: rgba(255,255,255,0.3); }
.tlink[aria-current="true"] .bar i { background: var(--accent-ink); }
.mobile-pick { display: none; }

main.sheet { min-width: 0; }
.th { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
.eyebrow { font: 600 12px var(--f-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.th h2 { font: 800 clamp(22px, 3vw, 30px)/1.15 var(--f-display); margin: 4px 0 2px; letter-spacing: -0.01em; text-wrap: balance; }
.th .ru { color: var(--muted); margin: 0 0 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); font: 500 13px var(--f-body); padding: 7px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 13px var(--f-body); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost-danger { color: var(--bad); }
.th .meta { margin-top: 12px; font-size: 13px; color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.list { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 14px; border-left: 4px solid var(--line); }
.card.is-ok { border-left-color: var(--ok); }
.card.is-bad { border-left-color: var(--bad); }
.card-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font: 500 12px var(--f-mono); color: var(--muted); }
.card-h .num { color: var(--ink); font-weight: 600; font-size: 13px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font: 500 11px var(--f-body); letter-spacing: 0.03em; }
.diff { display: inline-flex; gap: 3px; margin-left: auto; align-items: center; }
.diff i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.diff i.on { background: var(--warn); }
.q { font-size: 16px; line-height: 1.6; overflow-wrap: anywhere; }
.q .katex { font-size: 1.08em; }
.tw { overflow-x: auto; margin: 10px 0 2px; }
table.dt { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
table.dt th, table.dt td { border: 1px solid var(--line); padding: 5px 12px; text-align: center; }
table.dt th { background: var(--accent-soft); font-weight: 600; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.choices.long { grid-template-columns: minmax(0, 1fr); }
.ch { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 12px; font: 400 15px/1.45 var(--f-body); cursor: pointer; min-width: 0; }
.ch:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.ch .L { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font: 600 13px var(--f-mono); }
.ch:disabled { cursor: default; }
.ch.right { border-color: var(--ok); background: var(--ok-soft); }
.ch.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ch.dim { opacity: 0.55; }
.spr { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.spr input { font: 500 16px var(--f-mono); padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 170px; max-width: 100%; }
.spr .hint { font-size: 12px; color: var(--muted); }
.fb { margin-top: 10px; font-weight: 600; font-size: 14px; }
.fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); }
.sol { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 14.5px; }
.sol b { font-family: var(--f-mono); font-weight: 600; }
.card-f { display: flex; gap: 8px; margin-top: 10px; }
.linkish { border: 0; background: none; color: var(--accent); font: 500 13px var(--f-body); padding: 2px 0; cursor: pointer; }
.empty { padding: 24px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside.rail { display: none; }
  .mobile-pick { display: block; margin-bottom: 12px; }
  .mobile-pick select { width: 100%; font: 500 15px var(--f-body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
}
@media (max-width: 520px) { .choices { grid-template-columns: minmax(0, 1fr); } .stat { min-width: 0; flex: 1; } }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .2s; } }
</style>

</head><body style="margin:0"><div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>SAT Math Drill</h1>
      <p>1520 задач в формате цифрового SAT: 19 тем, по 80 задач в каждой. Нажимай вариант или вводи ответ, решение откроется сразу.</p>
    </div>
    <div class="score" aria-live="polite">
      <div class="stat"><b id="sDone">0</b><span>решено</span></div>
      <div class="stat"><b id="sAcc">—</b><span>точность</span></div>
      <div class="stat"><b>1520</b><span>всего задач</span></div>
    </div>
  </header>

  <div class="layout">
    <aside class="rail" id="rail" aria-label="Темы"></aside>
    <main class="sheet">
      <div class="mobile-pick"><label for="topicSelect" class="eyebrow">Тема</label><select id="topicSelect"></select></div>
      <section class="th" id="topicHead"></section>
      <div class="list" id="list"></div>
    </main>
  </div>
</div>

const bin = Uint8Array.from(atob(B64), c => c.charCodeAt(0));
const txt = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
const DATA = JSON.parse(txt);
const WEIGHT = {"Algebra": "≈35%", "Advanced Math": "≈35%", "Problem-Solving & Data Analysis": "≈15%", "Geometry & Trigonometry": "≈15%"};
const DOM_RU = {"Algebra": "Алгебра", "Advanced Math": "Продвинутая математика", "Problem-Solving & Data Analysis": "Задачи и анализ данных", "Geometry & Trigonometry": "Геометрия и тригонометрия"};
const KEY = "satdrill:v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

const byId = Object.fromEntries(DATA.map(t => [t.id, t]));
let cur = DATA[0].id, typeF = "all", diffF = "all", order = null;

function mathify(s, big) {
  if (!window.katex) return s;
  return s.replace(/\\\(([\s\S]*?)\\\)/g, (_, tex) => {
    try { return katex.renderToString((big ? "\\displaystyle " : "") + tex, { throwOnError: false }); } catch (e) { return tex; }
  });
}
function rec(tid) { return store[tid] || (store[tid] = {}); }
function topicStats(tid) {
  const r = store[tid] || {}; const ks = Object.keys(r).filter(k => k[0] !== "_");
  return { done: ks.length, ok: ks.filter(k => r[k]).length };
}
function overall() {
  let d = 0, o = 0; for (const t of DATA) { const s = topicStats(t.id); d += s.done; o += s.ok; }
  document.getElementById("sDone").textContent = d;
  document.getElementById("sAcc").textContent = d ? Math.round(100 * o / d) + "%" : "—";
}

function renderRail() {
  const rail = document.getElementById("rail"), sel = document.getElementById("topicSelect");
  let html = "", opts = "", lastDom = null;
  for (const t of DATA) {
    if (t.domain !== lastDom) {
      if (lastDom) html += "</div>";
      html += `<div class="dom"><div class="dom-h"><span>${DOM_RU[t.domain]}</span><em>${WEIGHT[t.domain]}</em></div>`;
      if (lastDom) opts += "</optgroup>";
      opts += `<optgroup label="${DOM_RU[t.domain]}">`;
      lastDom = t.domain;
    }
    const s = topicStats(t.id);
    html += `<button class="tlink" data-t="${t.id}" aria-current="${t.id === cur}"><span>${t.ru}</span><small>${s.done}/80</small><span class="bar"><i style="width:${s.done / 80 * 100}%"></i></span></button>`;
    opts += `<option value="${t.id}" ${t.id === cur ? "selected" : ""}>${t.ru} · ${s.done}/80</option>`;
  }
  rail.innerHTML = html + "</div>";
  sel.innerHTML = opts + "</optgroup>";
}

function renderHead() {
  const t = byId[cur], s = topicStats(cur);
  const segT = [["all", "Все"], ["mc", "С вариантами"], ["spr", "Ввод ответа"]];
  const segD = [["all", "Любые"], ["E", "Лёгкие"], ["M", "Средние"], ["H", "Сложные"]];
  const mc = t.problems.filter(p => p.choices).length;
  document.getElementById("topicHead").innerHTML = `
    <div class="eyebrow">${t.domain}</div>
    <h2>${t.en}</h2>
    <p class="ru">${t.ru}</p>
    <div class="controls">
      <div class="seg" role="group" aria-label="Тип задачи">${segT.map(([k, l]) => `<button data-type="${k}" aria-pressed="${typeF === k}">${l}</button>`).join("")}</div>
      <div class="seg" role="group" aria-label="Сложность">${segD.map(([k, l]) => `<button data-diff="${k}" aria-pressed="${diffF === k}">${l}</button>`).join("")}</div>
      <button class="btn" id="shuffle">${order ? "По порядку" : "Перемешать"}</button>
      <button class="btn ghost-danger" id="reset">Сбросить тему</button>
    </div>
    <div class="meta">${mc} с вариантами ответа · ${80 - mc} с вводом ответа · решено ${s.done} из 80, верно ${s.ok}</div>`;
}

const DIFF_N = { E: 1, M: 2, H: 3 };
function cardHTML(p) {
  const r = rec(cur)[p.n];
  const state = r === undefined ? "" : (r ? "is-ok" : "is-bad");
  const dots = [1, 2, 3].map(i => `<i class="${i <= DIFF_N[p.d] ? "on" : ""}"></i>`).join("");
  let body = "";
  if (p.choices) {
    const long = p.choices.some(c => c.replace(/\\\(.*?\\\)/g, "xx").length > 38);
    body = `<div class="choices ${long ? "long" : ""}">` + p.choices.map((c, i) => {
      const L = "ABCD"[i];
      let cls = "";
      if (r !== undefined) cls = L === p.a ? "right" : (rec(cur)["_" + p.n] === L ? "wrong" : "dim");
      return `<button class="ch ${cls}" data-n="${p.n}" data-l="${L}" ${r !== undefined ? "disabled" : ""}><span class="L">${L}</span><span>${mathify(c, true)}</span></button>`;
    }).join("") + "</div>";
  } else {
    const prev = rec(cur)["_" + p.n] || "";
    body = `<form class="spr" data-n="${p.n}"><input id="in-${cur}-${p.n}" inputmode="decimal" autocomplete="off" placeholder="напр. 3/4 или 2.5" value="${prev}" ${r !== undefined ? "disabled" : ""} aria-label="Ответ"><button class="btn primary" ${r !== undefined ? "disabled" : ""}>Проверить</button><span class="hint">Дробь или десятичная запись</span></form>`;
  }
  const ansText = p.choices ? p.a : p.a;
  const fb = r === undefined ? "" : `<div class="fb ${r ? "ok" : "bad"}">${r ? "Верно" : "Неверно, правильный ответ: " + ansText}</div>`;
  const sol = r === undefined ? "" : `<div class="sol"><b>Решение.</b> ${p.sol}</div>`;
  const reveal = r === undefined ? `<div class="card-f"><button class="linkish" data-reveal="${p.n}">Показать ответ</button></div>` : "";
  return `<article class="card ${state}" id="c-${p.n}">
    <div class="card-h"><span class="num">№ ${p.n}</span><span class="chip">${p.choices ? "Варианты" : "Ввод"}</span><span class="diff" title="Сложность">${dots}</span></div>
    <div class="q">${p.q}</div>${body}${fb}${sol}${reveal}</article>`;
}

function visible() {
  let ps = byId[cur].problems.filter(p => (typeF === "all" || (typeF === "mc") === !!p.choices) && (diffF === "all" || p.d === diffF));
  if (order) ps = order.map(n => ps.find(p => p.n === n)).filter(Boolean);
  return ps;
}
function renderList() {
  const ps = visible();
  document.getElementById("list").innerHTML = ps.length ? mathify(ps.map(cardHTML).join("")) :
    `<div class="empty">В этой теме нет задач с выбранными фильтрами. Выбери «Все» или «Любые».</div>`;
}
function rerenderCard(n) {
  const p = byId[cur].problems.find(x => x.n === n);
  const el = document.getElementById("c-" + n);
  if (el) el.outerHTML = mathify(cardHTML(p));
}
function renderAll() { renderRail(); renderHead(); renderList(); overall(); }
function refreshMeta() { renderRail(); renderHead(); overall(); }

function parseNum(s) {
  s = String(s).trim().replace(",", ".").replace(/\s+/g, "");
  if (!s) return NaN;
  if (/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)) { const [a, b] = s.split("/").map(Number); return b === 0 ? NaN : a / b; }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return Number(s);
  return NaN;
}
function sprCorrect(input, p) {
  const u = parseNum(input), a = parseNum(p.a);
  if (isNaN(u)) return null;
  if (Math.abs(u - a) < 1e-9) return true;
  // SAT accepts decimals rounded or truncated to the available digits
  return Math.abs(u - a) < 0.0051 && String(input).replace("-", "").length >= 4;
}

function setTopic(id, push = true) {
  if (!byId[id]) id = DATA[0].id;
  cur = id; order = null; typeF = "all"; diffF = "all";
  if (push) { try { history.replaceState(null, "", "#" + id); } catch (e) { location.hash = id; } }
  renderAll();
  window.scrollTo({ top: 0 });
}

document.addEventListener("click", e => {
  const tl = e.target.closest(".tlink"); if (tl) return setTopic(tl.dataset.t);
  const tb = e.target.closest("[data-type]"); if (tb) { typeF = tb.dataset.type; renderHead(); renderList(); return; }
  const db = e.target.closest("[data-diff]"); if (db) { diffF = db.dataset.diff; renderHead(); renderList(); return; }
  if (e.target.closest("#shuffle")) {
    if (order) order = null; else { order = byId[cur].problems.map(p => p.n); for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } }
    renderHead(); renderList(); return;
  }
  const rs = e.target.closest("#reset");
  if (rs) {
    if (rs.dataset.armed) { delete store[cur]; save(); renderAll(); return; }
    rs.dataset.armed = "1"; rs.textContent = "Точно сбросить? Нажми ещё раз";
    setTimeout(() => { if (rs.isConnected) { delete rs.dataset.armed; rs.textContent = "Сбросить тему"; } }, 3500);
    return;
  }
  const ch = e.target.closest(".ch");
  if (ch && !ch.disabled) {
    const n = +ch.dataset.n, p = byId[cur].problems.find(x => x.n === n);
    rec(cur)[n] = ch.dataset.l === p.a; rec(cur)["_" + n] = ch.dataset.l;
    save(); rerenderCard(n); refreshMeta(); return;
  }
  const rv = e.target.closest("[data-reveal]");
  if (rv) {
    const n = +rv.dataset.reveal; rec(cur)[n] = false; rec(cur)["_" + n] = "—"; save(); rerenderCard(n); refreshMeta();
  }
});
document.addEventListener("submit", e => {
  const f = e.target.closest(".spr"); if (!f) return;
  e.preventDefault();
  const n = +f.dataset.n, p = byId[cur].problems.find(x => x.n === n);
  const val = f.querySelector("input").value;
  const ok = sprCorrect(val, p);
  if (ok === null) { f.querySelector(".hint").textContent = "Введи число: 12, -3.5 или 7/4"; return; }
  rec(cur)[n] = ok; rec(cur)["_" + n] = val; save(); rerenderCard(n); refreshMeta();
});
document.getElementById("topicSelect").addEventListener("change", e => setTopic(e.target.value));
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== cur && byId[h]) setTopic(h, false); });

setTopic((location.hash || "").slice(1) || DATA[0].id, false);
})();
</script>
